name: Cloudflare Automated Blind Scan

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  blind-scan:
  # 统一在 Linux 环境下运行，确保 shell 脚本与路径兼容
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 纯净冷门 IP 生成器（已优化：O(1) 索引采样，彻底剔除万人骑大热段）
      - name: Generate Pure Cold IP Pool
        run: |
          python3 - << 'EOF'
          import random
          import ipaddress

          print("Generating pure cold candidate IP pool...")

          # 严厉屏蔽污染严重的主流“万人骑”大热公开网段
          blacklist_networks = [
              ipaddress.ip_network("104.16.0.0/12"),
              ipaddress.ip_network("104.24.0.0/14"),
              ipaddress.ip_network("172.67.0.0/16"),
              ipaddress.ip_network("108.162.192.0/18")
          ]

          def is_blacklisted(ip_obj):
              for net in blacklist_networks:
                  if ip_obj in net:
                      return True
              return False

          candidates = set()
          
          # 聚焦于延迟表现较好、日常公开脚本极少大面积轰炸的优质冷门边缘子网
          target_seed_ranges = [
              "162.159.32.0/20",  
              "198.41.192.0/20",  
              "141.101.64.0/18"   
          ]

          for s_net in target_seed_ranges:
              net_obj = ipaddress.ip_network(s_net)
              total_hosts = net_obj.num_addresses - 2
              if total_hosts <= 0:
                  continue
              
              sampled_count = 0
              attempts = 0
              while sampled_count < 150 and attempts < 1000:
                  attempts += 1
                  offset = random.randint(1, total_hosts)
                  ip_obj = net_obj[offset]
                  if not is_blacklisted(ip_obj):
                      candidates.add(str(ip_obj))
                      sampled_count += 1

          final_list = list(candidates)
          with open("custom_ip.txt", "w") as f:
              for ip in final_list:
                  f.write(ip + "\n")
                  
          print(f"Successfully generated {len(final_list)} elite cold candidate IPs.")
          EOF

      # 2. 自动下载并解压官方最新版 CloudflareST 测速工具
      - name: Download and Extract CFST
        run: |
          wget -O CFst.tar.gz $(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | cut -d '"' -f 4)
          tar -zxvf CFst.tar.gz
          chmod +x cfst_linux_amd64/cfst

      # 3. 稳妥的标准测速调用（回归最安全的无歧义原生参数，彻底杜绝参数错位卡死）
      - name: Run Safe SpeedTest
        run: |
          cd cfst_linux_amd64
          # 使用最干净、最标准的参数调用，依靠 CFST 内置的最优逻辑全自动筛选
          ./cfst -f ../custom_ip.txt -url https://nanxia.jinzhengen.cc.cd/ -o ../result.csv

      # 4. 智能防御与提交（包含严格的非空文件校验，绝对不让空结果覆盖你的 ip.txt）
      - name: Validate and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 检查 result.csv 是否存在且行数大于 1（即必须测出有效 IP 才肯放行）
          if [ -f "result.csv" ] && [ $(wc -l < result.csv) -gt 1 ]; then
              echo "SpeedTest successful. Updating ip.txt..."
              awk -F, 'NR>1 {print $1}' result.csv > ip.txt
              git add result.csv ip.txt custom_ip.txt
              git commit -m "Auto Blind Scan Update: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
              git push
          else
              echo "Error: SpeedTest yielded no valid IPs or result.csv is missing. Protecting existing ip.txt."
              exit 1
          fi
