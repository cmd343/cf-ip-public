name: Cloudflare Balanced Blind Scan

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  balanced-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 生成大容量但去除了“万人骑”大热段的优质候选池（确保数量充足，绝不空车）
      - name: Generate Balanced IP Pool
        run: |
          python3 - << 'EOF'
          import random
          import ipaddress

          print("Generating balanced & pure candidate IP pool...")

          # 严厉屏蔽污染最严重的“万人骑”大热公开段
          blacklist_networks = [
              ipaddress.ip_network("104.16.0.0/12"),
              ipaddress.ip_network("104.24.0.0/14"),
              ipaddress.ip_network("172.67.0.0/16")
          ]

          def is_blacklisted(ip_str):
              ip_obj = ipaddress.ip_address(ip_str)
              for net in blacklist_networks:
                  if ip_obj in net:
                      return True
              return False

          candidates = set()
          
          # 扩大边缘和次级冷门网段的覆盖范围，确保有足够基数供高并发筛选
          target_seed_ranges = [
              "162.159.0.0/16",   # Cloudflare 边缘大段
              "198.41.128.0/17",  # 核心托管与边缘段
              "190.93.240.0/20"   # 相对小众的区域承载段
          ]

          for s_net in target_seed_ranges:
              net_obj = ipaddress.ip_network(s_net)
              all_hosts = list(net_obj.hosts())
              # 每个网段随机抽样 200 个，确保总量在 400-500 个左右
              sampled = random.sample(all_hosts, min(len(all_hosts), 200))
              for ip in sampled:
                  ip_str = str(ip)
                  if not is_blacklisted(ip_str):
                      candidates.add(ip_str)

          # 写入文件，控制在 400 个左右，既丰富又高效
          final_list = list(candidates)[:400]
          with open("custom_ip.txt", "w") as f:
              for ip in final_list:
                  f.write(ip + "\n")
                  
          print(f"Successfully prepared {len(final_list)} candidate IPs for robust scanning.")
          EOF

      # 2. 自动下载并解压 CFST 测速工具
      - name: Download and Extract CFST
        run: |
          wget -O CFst.tar.gz $(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | cut -d '"' -f 4)
          tar -zxvf CFst.tar.gz
          chmod +x cfst_linux_amd64/cfst

      # 3. 高并发闪电测速：扩大候选基数但保持高线程（-tp 600），要求选出前 50 个优质 IP
      - name: Run Robust SpeedTest
        run: |
          cd cfst_linux_amd64
          # -n 50：输出前 50 个最佳 IP
          # -t 250：适当放宽一点超时阈值（250ms），防止漏掉好 IP
          # -tp 600：600 线程高并发，400 个 IP 可以在 20 秒内全部测完
          ./cfst -f ../custom_ip.txt -url https://nanxia.jinzhengen.cc.cd/ -n 50 -t 250 -tp 600 -dn 10 -o ../result.csv

      # 4. 提交结果到仓库
      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          awk -F, 'NR>1 {print $1}' result.csv > ip.txt
          
          git add result.csv ip.txt custom_ip.txt
          git commit -m "Balanced Scan Update: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
