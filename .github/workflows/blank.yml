name: Cloudflare Auto SpeedTest

on:
  # 定时触发：UTC时间每天 0点 和 12点 分别自动跑一次（北京时间 早上8点 和 晚上8点）
  schedule:
    - cron: '0 0,12 * * *'
  # 允许你在网页上手动点击按钮立即运行
  workflow_dispatch:

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 自动通过 GitHub API 获取最新版本的 CloudflareSpeedTest 并解压
      - name: Download CFST
        run: |
          wget -O CFst.tar.gz $(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | cut -d '"' -f 4)
          tar -zxvf CFst.tar.gz

      # 3. 运行测速核心命令（已为你配置好专属域名）
      - name: Run SpeedTest
        run: |
          ./CloudflareSpeedTest -url https://nanxia.jinzhengen.cc.cd/ -n 300 -t 350 -dn 10 -o result.csv

      # 4. 自动把测速结果提交并保存到仓库中
      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 仅提取优选出的 IP 列表存为 ip.txt 方便后续调用
          awk -F, 'NR>1 {print $1}' result.csv > ip.txt
          
          git add result.csv ip.txt
          git commit -m "Update Cloudflare Best IPs: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
