name: Cloudflare Daily Ultimate Scan

on:
  schedule:
    # 每天北京时间早上 4:00 自动运行 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  ultimate-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 扩大样本：精准抽样 1500 个低风险骨干网段候选 IP（应对严苛的 50ms 筛选）
      - name: Generate 1500 Candidate IP Pool
        run: |
          python3 - << 'EOF'
          import random
          import ipaddress

          print("Generating 1500 candidate IP pool for strict sub-50ms filtering...")

          # 严厉屏蔽高风险、易被滥用的网段
          blacklist_networks = [
              ipaddress.ip_network("104.16.0.0/12"),
              ipaddress.ip_network("104.24.0.0/14"),
              ipaddress.ip_network("172.67.0.0/16"),
              ipaddress.ip_network("108.162.192.0/18"),
              ipaddress.ip_network("141.101.64.0/18")
          ]

          def is_blacklisted(ip_obj):
              for net in blacklist_networks:
                  if ip_obj in net:
                      return True
              return False

          candidates = set()
          target_seed_ranges = [
              "162.159.192.0/18",  # 高性能边缘与大流量承载段
              "198.41.128.0/17"    # 核心托管与高吞吐段
          ]

          attempts = 0
          # 扩大到 1500 个候选 IP，确保 50ms 筛选下不会断档
          while len(candidates) < 1500 and attempts < 30000:
              attempts += 1
              s_net = random.choice(target_seed_ranges)
              net_obj = ipaddress.ip_network(s_net)
              total_hosts = net_obj.num_addresses - 2
              if total_hosts <= 0:
                  continue
              offset = random.randint(1, total_hosts)
              ip_obj = net_obj[offset]
              if not is_blacklisted(ip_obj):
                  candidates.add(str(ip_obj))

          print(f"Successfully generated {len(candidates)} candidate IPs.")
          with open("custom_ip.txt", "w") as f:
              for ip in candidates:
                  f.write(ip + "\n")
          EOF

      # 2. 自动下载并解压官方最新版 CloudflareST 测速工具
      - name: Download and Extract CFST
        run: |
          wget -O CFst.tar.gz $(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | cut -d '"' -f 4)
          tar -zxvf CFst.tar.gz
          chmod +x cfst_linux_amd64/cfst

      # 3. 云端极限体检：延迟上限死锁 50ms，速度下限 10MB/s
      - name: Run Strict Sub-50ms SpeedTest
        run: |
          cd cfst_linux_amd64
          # 参数说明：
          # -tl 50 : 严格限定平均延迟必须在 50ms 以内
          # -sl 10 : 速度下限必须达到 10 MB/s
          # -dn 50 : 挑选前 50 个顶级精英 IP
          ./cfst -f ../custom_ip.txt -url https://nanxia.jinzhengen.cc.cd/ -p 443 -tl 50 -sl 10 -dn 50 -o ../result.csv

      # 4. 强指标校验与智能安全提交（防空车保护机制）
      - name: Validate and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          if [ -f "result.csv" ] && [ $(wc -l < result.csv) -gt 1 ]; then
              echo "Strict sub-50ms SpeedTest passed successfully. Updating ip.txt..."
              awk -F, 'NR>1 {print $1}' result.csv > ip.txt
              git add result.csv ip.txt custom_ip.txt
              git commit -m "Daily 4AM Sub-50ms Elite Update (1500 Pool, 50 IPs, Speed >= 10MB/s): $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
              git push
          else
              echo "Error: Sub-50ms criteria too strict or result.csv missing. Protecting existing ip.txt and aborting."
              exit 1
          fi
